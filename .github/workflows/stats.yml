name: Profile stats

on:
  schedule:
    - cron: "41 22 * * *"   # sekali sehari (05:41 WIB)
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate card
        env:
          # Buat secret STATS_TOKEN (PAT classic, scope: repo + read:user + read:org)
          # agar repo privat & kolaborasi ikut dihitung (hanya angka, tanpa nama repo).
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          STATS_TZ: Asia/Jakarta
          STATS_LANG: en            # en | id
          STATS_TAGLINE: "Building Racara · quiet, useful things for the web"
          STATS_PRIVATE_LANGS: "true" # "false" = bahasa repo privat tidak ditampilkan
          STATS_HIDE_LANGS: ""      # contoh: "HTML,CSS"
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh stats"
          git push
